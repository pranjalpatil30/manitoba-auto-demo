---
- name: Start and verify OpenShift Virtualization VM
  hosts: localhost
  gather_facts: no
  connection: local

  vars:
    namespace: pranjalpatil-ibm-dev
    vm_name: rhel-10-manitoba-auto
    service_name: headless
    wait_timeout: 300  # 5 minutes

  tasks:
    - name: Ensure VirtualMachine exists
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"
      register: vm_info
      failed_when: vm_info.resources | length == 0

    - name: Verify VM is configured to run
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"
      register: vm_status

    - name: Display VM configuration
      debug:
        msg:
          - "VM runStrategy: {{ vm_status.resources[0].spec.runStrategy }}"
          - "VM running field: {{ vm_status.resources[0].spec.running | default('not set') }}"
          - "Waiting for VM to start..."

    - name: Wait for VirtualMachineInstance to be created
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"
      register: vmi_info
      until: vmi_info.resources | length > 0
      retries: 30
      delay: 10

    - name: Wait for VM to be Running
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"
      register: vmi_status
      until: 
        - vmi_status.resources | length > 0
        - vmi_status.resources[0].status.phase is defined
        - vmi_status.resources[0].status.phase == "Running"
      retries: 60
      delay: 5

    - name: Get VM IP address
      set_fact:
        vm_ip: "{{ vmi_status.resources[0].status.interfaces[0].ipAddress | default('N/A') }}"

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ vm_name }}.{{ service_name }}.{{ namespace }}.svc.cluster.local"
        port: 22
        timeout: "{{ wait_timeout }}"
        state: started
      ignore_errors: yes
      register: ssh_wait

    - name: Display VM status
      debug:
        msg:
          - "VM Status: Running"
          - "VM Name: {{ vm_name }}"
          - "VM IP: {{ vm_ip }}"
          - "SSH Target: {{ vm_name }}.{{ service_name }}.{{ namespace }}.svc.cluster.local"
          - "SSH Available: {{ 'Yes' if ssh_wait is succeeded else 'Pending (may take a few more minutes)' }}"

    - name: Confirm VM is ready
      debug:
        msg: "VM {{ vm_name }} is running and ready for use"

