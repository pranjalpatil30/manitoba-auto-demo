---
- name: Destroy OpenShift Virtualization VM via kubernetes.core
  hosts: localhost
  gather_facts: no
  connection: local

  vars:
    namespace: pranjalpatil-ibm-dev
    vm_name: rhel-10-manitoba-auto
    service_name: headless

  tasks:
    - name: Delete VirtualMachine
      kubernetes.core.k8s:
        state: absent
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"

    - name: Delete headless Service
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        name: "{{ service_name }}"
        namespace: "{{ namespace }}"

    - name: Confirm teardown
      debug:
        msg: "VM and Service deleted from {{ namespace }}"
